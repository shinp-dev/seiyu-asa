name: CI and Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock=false
      - run: npm test
      - run: npm run build
      - name: Probe Beisia JAN page
        run: |
          node -e "fetch('https://netsuper.rakuten.co.jp/beisia/item/4903110330523/',{headers:{'user-agent':'Mozilla/5.0 (Linux; Android 15; Mobile) AppleWebKit/537.36 Chrome/140 Safari/537.36','accept':'text/html,application/xhtml+xml','accept-language':'ja,en-US;q=0.9'}}).then(async r=>{const t=await r.text(); if(!r.ok||!t.includes('4903110330523')||!t.includes('イチゴスペシャル')){console.error('beisia status='+r.status+' jan='+t.includes('4903110330523')+' name='+t.includes('イチゴスペシャル')+' len='+t.length); process.exit(1)}})"
      - name: Probe production retail lookup
        run: |
          node -e "fetch('https://seiyu-asa.pages.dev/api/retail/lookup?jan=4903110330523&sources=beisia,tokiwa,youme').then(async r=>{const t=await r.text(); let j={}; try{j=JSON.parse(t)}catch{}; if(!r.ok||!j.product||!String(j.product.name||'').includes('イチゴスペシャル')){console.error('production status='+r.status+' body='+t.slice(0,500)); process.exit(1)}})"
      - name: Verify Pages output
        run: |
          test -f dist/index.html
          test -f dist/app.js
          test -f functions/api/seiyu/search.js
          test -f functions/api/seiyu/product.js
          test -f functions/api/product/lookup.js
          test -f functions/api/maker/lookup.js

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock=false
      - run: npm run build

      - name: Deploy to Cloudflare Pages
        run: |
          npx wrangler pages deploy dist \
            --project-name=seiyu-asa \
            --branch=main \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="${{ github.event.head_commit.message || 'manual deploy' }}"
