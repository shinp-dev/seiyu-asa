name: CI and Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock=false
      - run: npm test
      - run: npm run build
      - name: Verify Pages output
        run: |
          test -f dist/index.html
          test -f dist/app.js
          test -f functions/api/seiyu/search.js
          test -f functions/api/seiyu/product.js
          test -f functions/api/product/lookup.js
          test -f functions/api/maker/lookup.js
          test -f functions/api/retail/lookup.js

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock=false
      - run: npm run build

      - name: Deploy to Cloudflare Pages
        run: |
          npx wrangler pages deploy dist \
            --project-name=seiyu-asa \
            --branch=main \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="${{ github.event.head_commit.message || 'manual deploy' }}"

      - name: Verify kcal for known JAN in production
        run: |
          node -e "const u='https://seiyu-asa.pages.dev/api/seiyu/product?jan=4903110330523&reader=1'; const wait=ms=>new Promise(r=>setTimeout(r,ms)); (async()=>{for(let i=0;i<3;i++){try{const r=await fetch(u,{cache:'no-store'});const t=await r.text();let j={};try{j=JSON.parse(t)}catch{};if(r.ok&&j.item&&String(j.item.name||'').includes('イチゴスペシャル')&&Number(j.item.kcal)>0&&String(j.item.kcalBasis||'').includes('個')){console.log('nutrition lookup OK: '+j.item.kcal+' kcal '+j.item.kcalBasis+' via '+j.fetchVia);return;}console.error('attempt '+(i+1)+' status='+r.status+' body='+t.slice(0,500))}catch(e){console.error('attempt '+(i+1)+' '+e.message)}await wait(3000)}process.exit(1)})()"

      - name: Verify retail JAN lookup in production
        run: |
          node -e "const u='https://seiyu-asa.pages.dev/api/retail/lookup?jan=4903110330523&sources=beisia,tokiwa,youme,rakutenmart&reader=1'; const wait=ms=>new Promise(r=>setTimeout(r,ms)); (async()=>{for(let i=0;i<3;i++){try{const r=await fetch(u,{cache:'no-store'}); const t=await r.text(); let j={}; try{j=JSON.parse(t)}catch{}; if(r.ok&&j.product&&String(j.product.name||'').includes('イチゴスペシャル')&&Number(j.product.kcal)>0&&j.product.netPrice==null){console.log('retail nutrition OK: '+j.product.kcal+' kcal via '+j.product.retailer); return;} console.error('attempt '+(i+1)+' status='+r.status+' body='+t.slice(0,300));}catch(e){console.error('attempt '+(i+1)+' '+e.message)} await wait(3000);} process.exit(1)})()"
