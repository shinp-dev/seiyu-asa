name: CI and Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock=false
      - run: npm test
      - run: npm run build
      - name: Verify Pages output
        run: |
          test -f dist/index.html
          test -f dist/app.js
          test -f functions/api/seiyu/search.js
          test -f functions/api/seiyu/product.js
          test -f functions/api/product/lookup.js
          test -f functions/api/maker/lookup.js
          test -f functions/api/retail/lookup.js

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock=false
      - run: npm run build

      - name: Deploy to Cloudflare Pages
        run: |
          npx wrangler pages deploy dist \
            --project-name=seiyu-asa \
            --branch=main \
            --commit-hash="${GITHUB_SHA}" \
            --commit-message="${{ github.event.head_commit.message || 'manual deploy' }}"

      - name: Validate Seiyu nutrition endpoint (best-effort upstream availability)
        run: |
          node --input-type=module <<'NODE'
          const url = 'https://seiyu-asa.pages.dev/api/seiyu/product?jan=4903110330523&reader=1';
          const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
          let gotValidResponse = false;
          let gotNutrition = false;
          for (let i = 0; i < 3; i++) {
            try {
              const response = await fetch(url, { cache: 'no-store' });
              if (!response.ok) throw new Error('HTTP ' + response.status);
              const data = await response.json();
              if (!Object.hasOwn(data, 'item')) throw new Error('No item field');
              gotValidResponse = true;
              if (data.item) {
                const item = data.item;
                if (item.jan !== '4903110330523' ||
                    !String(item.name || '').includes('イチゴスペシャル') ||
                    !Number.isFinite(Number(item.kcal)) ||
                    Number(item.kcal) <= 0 ||
                    !String(item.kcalBasis || '').includes('個')) {
                  throw new Error('Invalid product response: ' + JSON.stringify(item).slice(0, 300));
                }
                console.log('Nutrition endpoint OK: ' + item.kcal + 'kcal via ' + data.fetchVia);
                gotNutrition = true;
                break;
              }
              console.log('Upstream Seiyu information unavailable (attempt ' + (i + 1) + ')');
            } catch (error) {
              if (String(error).includes('Invalid product response')) throw error;
              console.log('Upstream request issue: ' + error.message);
            }
            await wait(2000);
          }
          if (!gotValidResponse) process.exit(1);
          if (!gotNutrition) console.log('::warning::Seiyu upstream returned no nutrition this run; parser is checked in unit tests.');
          NODE

      - name: Validate retail JAN lookup and reject external prices
        run: |
          node --input-type=module <<'NODE'
          const url = 'https://seiyu-asa.pages.dev/api/retail/lookup?jan=4903110330523&sources=beisia,tokiwa,youme&reader=1';
          const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
          let gotValidResponse = false;
          let gotProduct = false;
          for (let i = 0; i < 3; i++) {
            try {
              const response = await fetch(url, { cache: 'no-store' });
              if (!response.ok) throw new Error('HTTP ' + response.status);
              const data = await response.json();
              if (!Object.hasOwn(data, 'product')) throw new Error('No product field');
              gotValidResponse = true;
              if (data.product) {
                if (data.product.jan !== '4903110330523' ||
                    !String(data.product.name || '').includes('イチゴスペシャル') ||
                    data.product.netPrice != null) {
                  throw new Error('Unexpected retailer result: ' + JSON.stringify(data.product).slice(0, 300));
                }
                console.log('Retail identity OK, other-store price excluded');
                gotProduct = true;
                break;
              }
              console.log('Retail upstream unavailable (attempt ' + (i + 1) + ')');
            } catch (error) {
              if (String(error).includes('Unexpected retailer result')) throw error;
              console.log('Upstream request issue: ' + error.message);
            }
            await wait(2000);
          }
          if (!gotValidResponse) process.exit(1);
          if (!gotProduct) console.log('::warning::Retail upstream returned no product this run; parser is checked in unit tests.');
          NODE
