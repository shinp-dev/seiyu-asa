<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#087a61">
  <meta name="description" content="朝の西友3点セットを提案する買い物支援Webアプリ">
  <title>もしあの時 - 西友あさ</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <header class="top">
      <div><small>朝の買い物アシスタント</small><h1>もしあの時</h1></div>
      <div class="top-actions"><strong class="seiyu">SEIYU</strong><button id="settings" class="settings-link" type="button">設定</button></div>
    </header>
    <main id="app"></main>
    <nav class="bottom">
      <button class="nav-item active" data-route="today">今日</button>
      <button class="nav-item" data-route="scan">スキャン</button>
      <button class="nav-item" data-route="history">履歴</button>
      <button class="nav-item" data-route="products">商品</button>
    </nav>
  </div>
  <script src="app.js"></script>
</body>
</html>
